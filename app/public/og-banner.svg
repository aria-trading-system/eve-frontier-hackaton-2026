<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <filter id="cyan-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#0f1117"/>

  <g transform="translate(600, 255)">
    <!-- Outer gray hexagon (pointy-top) with gap on right -->
    <path d="M 0,-155 L 134.4,-77.5 L 134.4,-24"
          fill="none" stroke="#3d4555" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 134.4,24 L 134.4,77.5 L 0,155 L -134.4,77.5 L -134.4,-77.5 L 0,-155"
          fill="none" stroke="#3d4555" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Single cyan hexagon with glow -->
    <polygon points="0,-110 95.3,-55 95.3,55 0,110 -95.3,55 -95.3,-55"
             fill="#0a0d14" stroke="#00d4ff" stroke-width="18" stroke-linejoin="round"
             filter="url(#cyan-glow)"/>
  </g>

  <!-- Star accent -->
  <g transform="translate(1105, 545)">
    <path d="M0,-10 L2.5,-2.5 L10,0 L2.5,2.5 L0,10 L-2.5,2.5 L-10,0 L-2.5,-2.5 Z"
          fill="#c0c8d8" opacity="0.5"/>
  </g>

  <text x="600" y="478" text-anchor="middle" fill="#e8ecf4"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="36" font-weight="500" letter-spacing="8">OPEN BORDERS PROTOCOL</text>

  <line x1="480" y1="502" x2="720" y2="502" stroke="#2d3340" stroke-width="1"/>

  <text x="600" y="530" text-anchor="middle" fill="#5a6577"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="14" font-weight="400" letter-spacing="4">EVE FRONTIER × SUI HACKATHON 2026</text>
</svg>
